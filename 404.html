<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — MedXplore</title>
<meta name="description" content="MedXplore is a student-run nonprofit that helps young people explore careers in medicine — free live sessions, mentorship, and access to professionals. Based in Mountain House, CA, open to students worldwide.">
<meta name="theme-color" content="#f9fafc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1230" media="(prefers-color-scheme: dark)">
<script>
/* Runs before paint so the page never flashes the wrong theme. When a saved
   choice contradicts the OS, the logo's <picture> source (which can only see the
   OS setting) is repointed once parsed; the logo stays hidden until the right
   variant has loaded, so the wrong one never shows. */
(function () {
  var d = document.documentElement, t = null;
  try { t = localStorage.getItem('medxplore-theme'); } catch { /* storage blocked */ }
  if (t !== 'dark' && t !== 'light') return;
  d.setAttribute('data-theme', t);
  var osDark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  if ((t === 'dark') === osDark) return;
  d.classList.add('logo-pending');
  document.addEventListener('DOMContentLoaded', function () {
    var reveal = function () { d.classList.remove('logo-pending'); };
    var srcs = document.querySelectorAll('source[data-theme-source]');
    srcs.forEach(function (s) { s.media = t === 'dark' ? 'all' : 'not all'; });
    var first = srcs[0] && srcs[0].parentNode.querySelector('img');
    if (first) { first.addEventListener('load', reveal, { once: true }); first.addEventListener('error', reveal, { once: true }); }
    setTimeout(reveal, 1200);
  });
})();
</script>
<!-- NOTE: og:image, og:url and canonical must be ABSOLUTE urls. If you publish
     anywhere other than https://medxplore.org/ , update all four together. -->
<meta name="robots" content="noindex">

<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">

<link rel="preload" href="/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/styles.css">

</head>
<body>
<main id="main" class="section" style="min-height:70vh;display:grid;place-items:center;text-align:center">
  <div class="wrap" style="max-width:620px">
    <a class="brand" href="/" style="display:flex;justify-content:center;margin:0 auto 34px">
      <picture>
          <source srcset="/logo-wordmark-dark.webp" media="(prefers-color-scheme: dark)" data-theme-source>
          <img src="/logo-wordmark.webp" alt="MedXplore" width="800" height="189" fetchpriority="high">
        </picture>
    </a>
    <p class="eyebrow" style="justify-content:center">404</p>
    <h1 style="font-size:clamp(2rem,5vw,3rem)">This page took a different pathway.</h1>
    <p class="lede" style="margin-inline:auto">
      The link you followed doesn&rsquo;t exist &mdash; but everything MedXplore does lives on one page,
      so you&rsquo;re one click away from all of it.
    </p>
    <p style="margin-top:28px">
      <a class="btn" href="/">
        Back to MedXplore
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
      </a>
    </p>
    <p style="margin-top:22px;font-size:.9rem;color:var(--ink-3)">
      Or email us at <a href="mailto:medxplore.mh@gmail.com">medxplore.mh@gmail.com</a>
    </p>
  </div>
